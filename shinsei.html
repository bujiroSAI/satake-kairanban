<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>書類をだす｜さたけの回覧板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .steps { display: flex; gap: 6px; margin: 16px 0 26px; }
  .steps i { flex: 1; height: 7px; border-radius: 4px; background: var(--sage); }
  .steps i.on { background: var(--green); }
  .fw h1 { font-family: var(--disp); font-weight: 700; font-size: 25px; color: var(--green-ink); }
  .fw .lead { color: var(--sub); font-size: 15px; margin-top: 4px; }
  .step { display: none; margin-top: 8px; }
  .step.on { display: block; }
  .pick { display: flex; flex-direction: column; gap: 10px; }
  .pick button {
    font-family: inherit; font-size: 17px; font-weight: 700; text-align: left;
    background: var(--panel); color: var(--ink); border: none; border-radius: 18px;
    padding: 16px 18px; cursor: pointer; min-height: 60px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    transition: transform .15s;
  }
  .pick button:active { transform: scale(.985); }
  .pick button small { display: block; font-weight: 400; font-size: 13px; color: var(--sub); }
  label.fl { display: block; font-weight: 700; margin: 18px 0 6px; font-size: 16px; }
  .fi { width: 100%; font-family: inherit; font-size: 17px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--panel); }
  .fi:focus { border-color: var(--green); outline: none; }
  textarea.fi { min-height: 110px; }
  .form-nav { display: flex; gap: 10px; margin-top: 26px; }
  .help-box { margin-top: 22px; background: var(--sage); border-radius: 16px; padding: 12px 16px; font-size: 14.5px; color: var(--green-ink); }
  .help-box a { font-weight: 700; }
  .done { text-align: center; padding-top: 16px; }
  .done img { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 14px; }
  .done h2 { font-family: var(--disp); font-weight: 700; font-size: 23px; color: var(--green-ink); }
  .done p { color: var(--sub); margin-top: 10px; font-size: 15.5px; }
</style>
</head>
<body>
<div class="bg-illust" aria-hidden="true"></div>
<div class="app fw">
  <header class="head">
    <img src="assets/img/owl.png" alt="">
    <div class="t">書類を出す<small>さたけの回覧板</small></div>
  </header>
  <p class="lead">紙に書いて事務所に持っていく代わりに、ここから出せます。3つ答えるだけです。</p>
  <div class="steps"><i class="on" id="s1"></i><i id="s2"></i><i id="s3"></i></div>

  <div class="step on" id="step1">
    <label class="fl">何を出しますか？</label>
    <div class="pick">
      <button onclick="pick('ふくろう祭り 出店申込')">ふくろう祭りに出店したい<small>しめきり 9月12日</small></button>
      <button onclick="pick('横断幕コンテスト 応募')">横断幕コンテストに応募したい<small>しめきり 9月30日</small></button>
      <button onclick="pick('助成金の申請そうだん')">助成金のことを相談したい<small>東京都チャレンジ戦略支援・二次 9月19日</small></button>
      <button onclick="pick('商店街共済の書類')">共済の書類を出したい<small>年度更新 10月15日まで</small></button>
      <button onclick="pick('お店の告知')">お店の告知をのせたい<small>セール・イベント・求人など。掲載は無料です</small></button>
      <button onclick="pick('SNS登録')">お店のSNSを登録したい<small>投稿が「今日の3本」に自動で流れます</small></button>
      <button onclick="pick('回覧板・アルバムへの掲載')">回覧板にのせたい・写真を投稿したい<small>掲載は無料です</small></button>
      <button onclick="pick('その他')">その他・どれかわからない<small>事務所からお電話します</small></button>
    </div>
    <div class="help-box">うまくいかないときは、事務所へどうぞ。<a href="tel:0338318926">☏ 03-3831-8926</a>（そのまま押せます）</div>
  </div>

  <div class="step" id="step2">
    <p style="font-family:var(--disp);font-weight:700;color:var(--green-ink);font-size:18px" id="picked"></p>
    <label class="fl" for="fName">お店・お名前</label>
    <input class="fi" id="fName" type="text" placeholder="例：ふくや 田中">
    <label class="fl" for="fTel">電話番号</label>
    <input class="fi" id="fTel" type="tel" placeholder="例：03-1234-5678">
    <label class="fl" for="fBody">内容（かんたんで大丈夫です）</label>
    <textarea class="fi" id="fBody" placeholder="例：からあげの屋台を出したい。テント1つ希望。"></textarea>
    <div class="form-nav">
      <button class="btn sub" onclick="go(1)">← 戻る</button>
      <button class="btn" style="flex:1" onclick="go(3)">これで出す</button>
    </div>
    <div class="help-box">うまくいかないときは、事務所へどうぞ。<a href="tel:0338318926">☏ 03-3831-8926</a></div>
  </div>

  <div class="step" id="step3">
    <div class="done">
      <img src="assets/img/owl.png" alt="">
      <h2>受け付けました</h2>
      <p>組合事務所で確認して、2〜3日のうちにお電話します。<br>控えは要りません。このままお店に戻って大丈夫です。</p>
      <p style="margin-top:20px"><a class="btn" href="index.html">回覧板に戻る</a></p>
    </div>
  </div>

  <footer class="foot"><small>本ページは提案用のモックアップです。「これで出す」を押しても実際には送信されません。</small></footer>
</div>
<script>
  function show(n) {
    for (var i = 1; i <= 3; i++) {
      document.getElementById('step' + i).classList.toggle('on', i === n);
      document.getElementById('s' + i).classList.toggle('on', i <= n);
    }
    window.scrollTo(0, 0);
  }
  function pick(what) { document.getElementById('picked').textContent = '「' + what + '」ですね。'; show(2); }
  function go(n) { show(n); }
</script>
</body>
</html>
